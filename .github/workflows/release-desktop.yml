name: Release desktop

# Pushing a tag like `desktop-v0.2.0` builds the desktop app for Windows, macOS and Linux and
# attaches the installers to that tag's GitHub Release (created as a draft if it doesn't exist).
# Running it by hand (Actions → Release desktop → Run workflow) only builds and uploads the
# installers as workflow artifacts: a dry run that publishes nothing.

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ytdlp: yt-dlp.exe
            args: --bundles nsis
          - name: macOS (universal)
            os: macos-latest
            target: universal-apple-darwin
            ytdlp: yt-dlp_macos
            args: --target universal-apple-darwin --bundles dmg
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ytdlp: yt-dlp_linux
            args: --bundles deb,appimage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # yt-dlp is bundled as a Tauri sidecar named for the target triple. Official release builds only.
      - name: Download yt-dlp sidecar
        working-directory: apps/desktop/src-tauri
        run: |
          mkdir -p binaries
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          curl -fsSL -o "binaries/yt-dlp-${{ matrix.target }}${ext}" \
            "https://github.com/yt-dlp/yt-dlp/releases/latest/download/${{ matrix.ytdlp }}"
          chmod +x binaries/*

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build (and attach to the release on tag pushes)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Desktop {0}', github.ref_name) || '' }}
          releaseDraft: true

      - name: Upload installers (dry run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: musiclify-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: error
