name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: "When I ..., I can't ..."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: Which app?
      multiple: true
      options: [Android, Desktop (Windows), Website, Both apps]
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
