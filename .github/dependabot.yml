version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups: { actions: { patterns: ["*"] } }

  - package-ecosystem: npm
    directory: /apps/desktop
    schedule: { interval: monthly }
    groups: { desktop-npm: { patterns: ["*"], update-types: [minor, patch] } }

  - package-ecosystem: npm
    directory: /apps/website
    schedule: { interval: monthly }
    groups: { website-npm: { patterns: ["*"], update-types: [minor, patch] } }

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule: { interval: monthly }
    groups: { cargo: { patterns: ["*"], update-types: [minor, patch] } }

  - package-ecosystem: gradle
    directory: /apps/android
    schedule: { interval: monthly }
    groups: { gradle: { patterns: ["*"], update-types: [minor, patch] } }
