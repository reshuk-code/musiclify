[package]
name = "musiclify"
version = "0.1.1"
description = "Musiclify desktop: local-first music player"
authors = ["Musiclify contributors"]
license = "GPL-3.0-or-later"
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin on Windows.
name = "musiclify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "fs", "io-util", "time", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
aes = "0.8"
ctr = "0.9"
aes-gcm = "0.10"
rand = "0.10"
base64 = "0.22"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
local-ip-address = "0.6"
tiny_http = "0.12"
url = "2"
regex = "1"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
